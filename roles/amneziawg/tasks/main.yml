---
- name: Check supported deployment platform and settings
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
      - ansible_facts['architecture'] == 'x86_64'
      - amneziawg_device is match('^[a-zA-Z0-9_.-]+$')
    fail_msg: This playbook supports Ubuntu 24.04 amd64; review other platforms before extending it.

- name: Validate VPN UDP port
  ansible.builtin.assert:
    that:
      - amneziawg_port is integer
      - amneziawg_port >= 1
      - amneziawg_port <= 65535
    fail_msg: Set amneziawg_port to an integer from 1 to 65535; the UDP port must be available on the host.

- name: Validate nginx settings and reject obsolete direct-public settings
  ansible.builtin.assert:
    that:
      - amneziawg_nginx_port is integer
      - amneziawg_nginx_port >= 1
      - amneziawg_nginx_port <= 65535
      - amneziawg_nginx_port != 51821
      - amneziawg_ui_public is boolean
      - amneziawg_nginx_tls_enabled is boolean
      - amneziawg_nginx_username is match('^[a-zA-Z0-9_.-]+$')
      - amneziawg_ui_port is undefined
      - amneziawg_tls_enabled is undefined
    fail_msg: >-
      Use amneziawg_ui_public, amneziawg_nginx_port (1..65535 except backend port 51821),
      amneziawg_nginx_tls_enabled and an alphanumeric nginx username.
      Rename the old ui_port and tls_enabled variables as documented.

- name: Inspect installed packages
  ansible.builtin.package_facts:
    manager: apt

- name: Refuse conflicting Docker packages
  ansible.builtin.assert:
    that:
      - "'docker.io' not in ansible_facts.packages"
      - "'podman-docker' not in ansible_facts.packages"
    fail_msg: Existing container runtimes need a separate migration plan.

- name: Explain first-install check mode limitation
  ansible.builtin.debug:
    msg: >-
      Check mode validates platform and existing state. On a fresh host, tasks requiring
      new repositories, packages, module or credentials are deferred to the actual install.
  when: ansible_check_mode

- name: Install AmneziaWG dependencies and runtime
  ansible.builtin.import_tasks: install.yml
  when: not ansible_check_mode

- name: Configure and verify AmneziaWG
  ansible.builtin.import_tasks: configure.yml
  when: not ansible_check_mode
